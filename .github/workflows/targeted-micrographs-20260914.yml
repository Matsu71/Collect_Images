name: Collect targeted microbial photographs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/targeted-micrographs-20260914.yml]
permissions:
  contents: write
concurrency:
  group: reviewed-photo-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /curation/
            /scripts/
            /tools/
            /data/
            /reports/
            /reviews/
            /reference/metadata/
            /batches/targeted-micrographs-20260914/
            /README.md
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'requests>=2.32,<3' 'Pillow>=11,<13'
      - name: Reconcile saved photographs without overwriting or double counting
        run: |
          python -m py_compile curation/reconcile_targeted_micrographs.py curation/finalize_collection_session_20260914.py curation/targeted_review_loader.py
          python -u curation/reconcile_targeted_micrographs.py
      - name: Apply actual individual review and verify the complete package
        run: |
          test -f reviews/targeted-micrographs-20260914.json
          git sparse-checkout disable
          python -u curation/run_reviewed_build.py
          python -u curation/finalize_collection_session_20260914.py --output "$RUNNER_TEMP/collection-session-photos"
      - name: Save reviewed catalogue and reconciliation evidence
        if: always()
        run: |
          git config user.name 'Collect Images bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse batches/targeted-micrographs-20260914 reports/ README.md
          if [ -d collection ]; then git add collection; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Finalize new photos, preserve prior assets and publish verified session results [skip ci]'
            pushed=false
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then pushed=true; break; fi
              sleep $((attempt * 4))
            done
            test "$pushed" = true
          fi
          if [ -d "$RUNNER_TEMP/collection-session-photos" ]; then
            git rev-parse HEAD > "$RUNNER_TEMP/collection-session-photos/source-commit.txt"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: targeted-micrograph-review
          path: |
            targeted-review/
            batches/targeted-micrographs-20260914/acquisition.json
            reports/continuation-session-20260914.json
            reports/session-validation-20260914.json
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: collection-session-photos
          path: ${{ runner.temp }}/collection-session-photos/
          if-no-files-found: error
          retention-days: 7
