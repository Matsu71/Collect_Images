name: Build reviewed photo collection
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/curate.yml
      - curation/build_collection.py
      - curation/run_reviewed_build.py
      - reports/detail-sample-review.json
      - tools/export_collection.py
      - reviews/**
      - curation-requests/**
  workflow_run:
    workflows:
      - Collect licensed extant photographs
      - Collect licensed reference photographs
    types: [completed]
permissions:
  contents: write
concurrency:
  group: reviewed-photo-collection
  cancel-in-progress: false
jobs:
  curate:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'requests>=2.32,<3' 'Pillow>=11,<13'
      - name: Apply actual visual decisions, individual JPEG corrections and credit checks
        run: python -u curation/run_reviewed_build.py
      - name: Verify portable exports and local gallery assets
        run: |
          python tools/export_collection.py --output "$RUNNER_TEMP/species-export-all" > /tmp/export-all.json
          python tools/export_collection.py --output "$RUNNER_TEMP/species-export-by" --licenses cc0,cc-by > /tmp/export-by.json
          python - <<'PY'
          import json,pathlib,datetime
          from html.parser import HTMLParser
          root=pathlib.Path.cwd();links=[]
          class Links(HTMLParser):
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  for k in ['src','href']:
                      if d.get(k) and not d[k].startswith(('http:','https:','#','data:')):links.append(d[k])
          Links().feed((root/'collection/index.html').read_text())
          missing=[p for p in links if not (root/'collection'/p).resolve().is_file()]
          assert not missing,missing[:10]
          all_info=json.loads(pathlib.Path('/tmp/export-all.json').read_text());by_info=json.loads(pathlib.Path('/tmp/export-by.json').read_text())
          result={'validatedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(timespec='seconds'),'allLicensePrimaryExport':all_info,'cc0AndByPrimaryExport':by_info,'galleryLocalLinksChecked':len(links),'galleryMissingAssets':missing,'exportCopyAndHashes':'pass'}
          assets=json.loads((root/'collection/assets.json').read_text())['records']
          invalid=[r['assetId'] for r in assets if r.get('author','').lower()=='no rights reserved']
          assert not invalid,invalid
          result['rightsNoticesMisrepresentedAsAuthors']=len(invalid)
          (root/'reports/export-validation.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(result,ensure_ascii=False))
          PY
      - name: Commit reviewed catalogue and evidence
        run: |
          git config user.name 'Collect Images bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add collection reports/curation-status.json reports/duplicate-photo-copies.json reports/primary-gaps.json reports/export-validation.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish screened collection with individual review and corrected credits [skip ci]'
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin HEAD:main && break
              sleep $((attempt * 5))
            done
            test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/main | cut -f1)"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewed-photo-collection-evidence
          path: |
            collection/review-sheets/
            collection/primary.json
            collection/taxa.json
            collection/credits.csv
            reports/curation-status.json
            reports/export-validation.json
            reports/curation-validation-errors.json
            reports/detail-sample-review.json
          retention-days: 7
