name: Collect remaining photo gaps round 3
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/round3-photos.yml
      - round3-requests/**
permissions:
  contents: write
concurrency:
  group: reviewed-photo-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /curation/
            /scripts/
            /tools/
            /data/
            /reports/
            /reviews/
            /metadata/
            /reference/metadata/
            /batches/*/candidates.json
            /batches/gaps-round3-20260914/
            /README.md
            /AGENTS.md
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'requests>=2.32,<3' 'Pillow>=11,<13'
      - name: Acquire or adopt explicitly reviewed files
        run: |
          python -m py_compile curation/round3_photos.py
          if [ -f reviews/round3-decisions-20260914.json ]; then
            git sparse-checkout disable
            python -u curation/round3_photos.py adopt
            python -u curation/round3_photos.py rebuild
            if [ -f curation/finalize_round3.py ]; then python -u curation/finalize_round3.py; fi
            python tools/export_collection.py --output "$RUNNER_TEMP/round3-portable"
            python tools/build_export_gallery.py "$RUNNER_TEMP/round3-portable"
            cp reports/curation-status.json "$RUNNER_TEMP/round3-portable/collection-status.json"
            cp reports/continuation-round3-20260914.json "$RUNNER_TEMP/round3-portable/collection-progress.json"
          elif [ ! -f batches/gaps-round3-20260914/candidates.json ]; then
            python -u curation/round3_photos.py gather
          else
            echo 'Candidate images already stored. Actual visual review required before adoption.'
          fi
      - name: Save image bytes and source evidence
        if: always()
        run: |
          git config user.name 'Collect Images bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse batches/gaps-round3-20260914 reference/metadata reports/ README.md
          if [ -d reference/images ]; then git add reference/images collection; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Save round-3 photo files, provenance and review progress [skip ci]'
            pushed=false
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then pushed=true; break; fi
              sleep $((attempt * 5))
            done
            test "$pushed" = true
          fi
          if [ -d "$RUNNER_TEMP/round3-portable" ]; then git rev-parse HEAD > "$RUNNER_TEMP/round3-portable/source-commit.txt"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round3-photo-review
          path: |
            batches/gaps-round3-20260914/sheets/
            batches/gaps-round3-20260914/candidates.json
            batches/gaps-round3-20260914/status.json
            batches/gaps-round3-20260914/target-gaps.json
            batches/gaps-round3-20260914/results.json
            batches/gaps-round3-20260914/adoption.json
            reports/curation-status.json
            reports/continuation-round3-20260914.json
            reports/round3-validation.json
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: round3-portable-species-photos
          path: ${{ runner.temp }}/round3-portable/
          if-no-files-found: ignore
          retention-days: 7
