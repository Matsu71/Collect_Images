name: Export photo review snapshot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/review-export.yml
      - review-requests/**
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Pin review snapshot and inventory imported source taxa
        run: |
          mkdir -p review-export
          git rev-parse HEAD > review-export/commit.txt
          date -u +%FT%TZ > review-export/exported-at.txt
          python - <<'PY'
          import json,collections,pathlib
          p=pathlib.Path('data/targets.json')
          data=json.loads(p.read_text());base=[t for t in data['records'] if t.get('collectionTier')=='chronoearth']
          report={'sourceUrl':data.get('source'),'sourceBlobSha':data.get('sourceBlobSha'),'checkedRepoBlobSha':data.get('checkedRepoBlobSha'),'exactSourceMatchAtImport':data.get('exactSourceMatch'),'importedUniqueChronoEarthTaxa':len(base),'sourceTypeCounts':dict(collections.Counter(t.get('sourceType') for t in base)),'note':'Counts describe the versioned imported/public-service target list, not an assertion that all canonical research records are deployed.'}
          pathlib.Path('review-export/source-count-audit.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photo-review-snapshot
          path: |
            gallery/
            metadata/
            catalog/
            reports/status.json
            reports/reference-status.json
            reports/missing.json
            reports/results.json
            data/targets.json
            reference/gallery/
            reference/metadata/
            reference/results.json
            reviews/
            review-export/
          retention-days: 7
